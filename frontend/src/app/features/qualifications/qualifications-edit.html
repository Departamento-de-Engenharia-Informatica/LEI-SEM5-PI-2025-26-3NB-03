<div class="page-card">

  <h2 class="page-title">{{ 'QUAL.EDIT_TITLE' | translate }}</h2>

  <div *ngIf="isLoading">
    {{ 'COMMON.LOADING' | translate }}
  </div>

  <form *ngIf="!isLoading" (ngSubmit)="save()">

    <div class="form-row">
      <label>{{ 'QUAL.CODE' | translate }}</label>
      <input [value]="code" disabled />
    </div>

    <div class="form-row">
      <label>{{ 'QUAL.NAME' | translate }}</label>
      <input [(ngModel)]="model.name" name="name" required />
    </div>

    <button class="btn-primary" type="submit">
      {{ 'BUTTON.UPDATE' | translate }}
    </button>

  </form>

</div>
