<div class="management-container">

    <div class="sidebar-list">
        <div class="list-header">
            <h3>{{ 'VVE.IN_PROGRESS_VVES' | translate }}</h3>
            <div class="actions">
                <button (click)="loadVVEs()" [disabled]="isLoading" title="{{ 'BUTTON.REFRESH' | translate }}">
                    <span *ngIf="!isLoading">↻</span>
                    <span *ngIf="isLoading">...</span>
                </button>
            </div>
        </div>

        <div class="list-items">
            <div *ngIf="isLoading" class="loading-message">
                {{ 'COMMON.LOADING' | translate }}...
            </div>

            <div
                *ngFor="let vve of VVEs" 
                [class.selected]="selectedVVE?.id === vve.id" 
                (click)="selectVVE(vve)" 
                class="active-vve"
            >
                [{{ formatArrivalDayMonth(vve.arrivalTime) }}] {{ vve.id }}
            </div>

            <div *ngIf="!VVEs.length && !isLoading" class="no-data">
                {{ 'COMMON.NO_DATA' | translate }}
            </div>
        </div>
    </div>

    <div class="details-form">
        <form (ngSubmit)="saveVVE()">

            <div class="form-group" [ngClass]="{ 'has-error': errorField.includes('berth') }">
                <label>{{ 'VVE.BERTH' | translate }}:</label>
                <input 
                  type="datetime-local"
                  [(ngModel)]="formModel.arrivalTime"
                  name="arrivalTime"
                  [disabled]="currentFormMode === 'view'"
                  required>
            </div>

            <div class="form-group" [ngClass]="{ 'has-error': errorField.includes('dock') }">
                <label>{{ 'VVE.DOCK' | translate }}:</label>

                <select 
                  [(ngModel)]="formModel.dockId"
                  name="dockId"
                  [disabled]="currentFormMode === 'view'"
                >
                  <option [ngValue]="null">{{ 'COMMON.NONE' | translate }}</option>
                  <option *ngFor="let dock of availableDocks" [ngValue]="dock.id">
                      {{ dock.name }}
                  </option>
              </select>
            </div>

            <div class="feedback-message" 
                *ngIf="feedbackMessage.text" 
                [class.success]="feedbackMessage.type === 'success'" 
                [class.error]="feedbackMessage.type === 'error'" 
                [innerHTML]="feedbackMessage.text">
            </div>

            <div class="form-actions" [class.hidden]="currentFormMode === 'view'">
                <button 
                    type="submit" 
                    *ngIf="currentFormMode !== 'view'" 
                    [disabled]="isSubmitting"
                >
                    {{ 'BUTTON.UPDATE' | translate }}
                </button>
            </div>
        </form>
    </div>
</div>
