<div class="container" style="max-width: 600px; padding: 2rem;">
  <h2>{{ 'INCIDENTS.CREATE_TITLE' | translate }}</h2>

  <form (ngSubmit)="onSubmit()">

    <div class="form-group">
      <label>{{ 'INCIDENTS.FORM.TITLE_LABEL' | translate }}</label>
      <input type="text" [(ngModel)]="incident.title" name="title" required class="form-control">
    </div>

    <div class="form-group">
      <label>{{ 'INCIDENTS.FORM.TYPE_LABEL' | translate }}</label>
      <select [(ngModel)]="incident.incidentType" name="type" class="form-control">
        <option value="Mechanical">{{ 'INCIDENTS.TYPES.MECHANICAL' | translate }}</option>
        <option value="Weather">{{ 'INCIDENTS.TYPES.WEATHER' | translate }}</option>
        <option value="Strike">{{ 'INCIDENTS.TYPES.STRIKE' | translate }}</option>
        <option value="Accident">{{ 'INCIDENTS.TYPES.ACCIDENT' | translate }}</option>
        <option value="Other">{{ 'INCIDENTS.TYPES.OTHER' | translate }}</option>
      </select>
    </div>

    <div class="form-group">
      <label>{{ 'INCIDENTS.FORM.SEVERITY_LABEL' | translate }}</label>
      <select [(ngModel)]="incident.severity" name="severity" class="form-control">
        <option value="MINOR">{{ 'INCIDENTS.SEVERITY.MINOR' | translate }}</option>
        <option value="MAJOR">{{ 'INCIDENTS.SEVERITY.MAJOR' | translate }}</option>
        <option value="CRITICAL">{{ 'INCIDENTS.SEVERITY.CRITICAL' | translate }}</option>
      </select>
    </div>

    <div class="form-group">
      <label>{{ 'INCIDENTS.FORM.START_LABEL' | translate }}</label>
      <input type="datetime-local" [(ngModel)]="incident.startTime" name="startTime" required class="form-control">
    </div>

    <div class="form-group">
      <label>{{ 'INCIDENTS.FORM.AFFECTED_LABEL' | translate }}</label>
      <input type="text" [(ngModel)]="incident.affectedVVEs" name="vves"
             [placeholder]="'INCIDENTS.FORM.PLACEHOLDER_VVE' | translate"
             class="form-control">
    </div>

    <div class="form-group">
      <label>{{ 'INCIDENTS.FORM.DESC_LABEL' | translate }}</label>
      <textarea [(ngModel)]="incident.description" name="description" rows="4" required class="form-control"></textarea>
    </div>

    <div class="actions" style="margin-top: 20px;">
      <button type="submit" class="btn-save">{{ 'INCIDENTS.BTN_SAVE' | translate }}</button>
      <button type="button" routerLink="/incidents" style="margin-left: 10px;">{{ 'INCIDENTS.BTN_CANCEL' | translate }}</button>
    </div>

  </form>
</div>
