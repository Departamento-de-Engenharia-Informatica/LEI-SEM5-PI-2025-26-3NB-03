<div class="management-container">

    <div class="sidebar-list">
        <div class="list-header">
            <h3>{{ 'MENU.REPRESENTATIVES' | translate }}</h3>
            <div class="actions">
                <button (click)="startCreate()" title="{{ 'BUTTON.NEW' | translate }}">+</button>
                <button (click)="loadRepresentatives()" [disabled]="isLoading" title="{{ 'BUTTON.REFRESH' | translate }}">
                    <span *ngIf="!isLoading">↻</span>
                    <span *ngIf="isLoading">...</span>
                </button>
            </div>
        </div>

        <div class="list-items">
            <div *ngIf="isLoading" class="loading-message">
                {{ 'COMMON.LOADING' | translate }}...
            </div>

            <div *ngFor="let rep of representatives" 
                [class.active-rep]="rep.active" 
                [class.inactive-rep]="!rep.active" 
                [class.selected]="selectedRepresentative?.id === rep.id" 
                (click)="selectRepresentative(rep)" 
            >
                {{ rep.id }} - {{ rep.name }}
            </div>

            <div *ngIf="!representatives.length && !isLoading" class="no-data">
                {{ 'COMMON.NO_DATA' | translate }}
            </div>
        </div>
    </div>

    <div class="details-form">
        <form (ngSubmit)="saveRepresentative()">

            <div class="form-group" [ngClass]="{ 'has-error': errorField.includes('citizenId') }">
                <label>{{ 'REPRESENTATIVE.CITIZEN_ID' | translate }}:</label>
                <input 
                    type="text" 
                    [(ngModel)]="formModel.id" 
                    name="id" 
                    required 
                    [disabled]="currentFormMode !== 'create'"
                >
            </div>

            <div class="form-group">
                <label>{{ 'REPRESENTATIVE.ORGANIZATION_ID' | translate }}:</label>
                <input type="text" 
                    [value]="getOrganizationName(formModel.shippingAgentOrganizationId ?? '')" 
                    disabled>
            </div>

            <div class="form-group" [ngClass]="{ 'has-error': errorField.includes('name') }">
                <label>{{ 'REPRESENTATIVE.NAME' | translate }}:</label>
                <input type="text" 
                    [(ngModel)]="formModel.name" 
                    name="name" 
                    [disabled]="currentFormMode === 'view'" 
                    required>
            </div>

            <div class="form-group" [ngClass]="{ 'has-error': errorField.includes('nationality') }">
                <label>{{ 'REPRESENTATIVE.NATIONALITY' | translate }}:</label>
                <input type="text" 
                    [(ngModel)]="formModel.nationality" 
                    name="nationality" 
                    [disabled]="currentFormMode === 'view'" 
                    required>
            </div>

            <div class="form-group" [ngClass]="{ 'has-error': errorField.includes('email') }">
                <label>{{ 'REPRESENTATIVE.EMAIL' | translate }}:</label>
                <input type="email" 
                    [(ngModel)]="formModel.email" 
                    name="email" 
                    [disabled]="currentFormMode === 'view'" 
                    required>
            </div>

            <div class="form-group" [ngClass]="{ 'has-error': errorField.includes('phoneNumber') }">
                <label>{{ 'REPRESENTATIVE.PHONE' | translate }}:</label>
                <input type="number" 
                    [(ngModel)]="formModel.phoneNumber" 
                    name="phoneNumber" 
                    [disabled]="currentFormMode === 'view'" 
                    required>
            </div>

            <div class="feedback-message" 
                *ngIf="feedbackMessage.text" 
                [class.success]="feedbackMessage.type === 'success'" 
                [class.error]="feedbackMessage.type === 'error'" 
                [innerHTML]="feedbackMessage.text">
            </div>

            <div class="form-actions" [class.hidden]="currentFormMode === 'view'">
                <button 
                    type="submit" 
                    *ngIf="currentFormMode !== 'view'" 
                    [disabled]="(currentFormMode === 'update' && selectedRepresentative && !selectedRepresentative.active) || isSubmitting"
                >
                    {{ (currentFormMode === 'create' ? 'BUTTON.CREATE' : 'BUTTON.UPDATE') | translate }}
                </button>

                <button 
                    type="button" 
                    (click)="deactivation()" 
                    *ngIf="currentFormMode === 'update' && selectedRepresentative && selectedRepresentative.active" 
                    class="deactivate"
                >
                    {{ 'BUTTON.DEACTIVATE' | translate }}
                </button>
                
                <button 
                    type="button" 
                    disabled 
                    *ngIf="currentFormMode === 'update' && selectedRepresentative && !selectedRepresentative.active" 
                    class="inactive-disabled"
                >
                    {{ 'BUTTON.INACTIVE' | translate }}
                </button>
            </div>
        </form>
    </div>
</div>
