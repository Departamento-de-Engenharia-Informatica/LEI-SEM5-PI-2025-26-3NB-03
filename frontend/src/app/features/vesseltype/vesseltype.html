<div class="management-container">

    <div class="sidebar-list">
        <div class="list-header">
            <h3>{{ 'MENU.VESSELTYPES' | translate }}</h3>
            <div class="actions">
                <button (click)="startCreate()" title="{{ 'BUTTON.NEW' | translate }}">+</button>
                <button (click)="loadVesselTypes()" [disabled]="isLoading" title="{{ 'BUTTON.REFRESH' | translate }}">
                    <span *ngIf="!isLoading">↻</span>
                    <span *ngIf="isLoading">...</span>
                </button>
            </div>
        </div>

        <div class="list-items">
            <div *ngIf="isLoading" class="loading-message">
                {{ 'COMMON.LOADING' | translate }}...
            </div>

            <div 
                *ngFor="let vt of vesseltypes" 
          
                [class.selected]="selectedVesselType?.id === vt.id"
                (click)="selectVesselType(vt)" 
            >
                {{ vt.name }}
            </div>

            <div *ngIf="!vesseltypes.length && !isLoading" class="no-data">
                {{ 'COMMON.NO_DATA' | translate }}
            </div>
        </div>
    </div>

    <div class="details-form">
        <form (ngSubmit)="saveVesselType()">


            <div class="form-group">
                <label>{{ 'VESSELTYPE.NAME' | translate }}:</label>
                <input type="text" [(ngModel)]="formModel.name" name="name" [disabled]="currentFormMode === 'view'" required>
            </div>

            <div class="form-group">
                <label>{{ 'VESSELTYPE.DESCRIPTION' | translate }}:</label>
                <input type="text" [(ngModel)]="formModel.description" name="description" [disabled]="currentFormMode === 'view'" required>
            </div>

            <div class="form-group">
                <label>{{ 'VESSELTYPE.CAPACITY' | translate }}:</label>
                <input type="number" [(ngModel)]="formModel.capacity" name="capacity" [disabled]="currentFormMode === 'view'" required>
            </div>

            <div class="form-group">
                <label>{{ 'VESSELTYPE.MAXROWS' | translate }}:</label>
                <input type="number" [(ngModel)]="formModel.maxRows" name="maxRows" [disabled]="currentFormMode === 'view'" required>
            </div>

            <div class="form-group">
                <label>{{ 'VESSELTYPE.MAXBAYS' | translate }}:</label>
                <input type="number" [(ngModel)]="formModel.maxBays" name="maxBays" [disabled]="currentFormMode === 'view'" required>
            </div>

            <div class="form-group">
                <label>{{ 'VESSELTYPE.MAXTIERS' | translate }}:</label>
                <input type="number" [(ngModel)]="formModel.maxTiers" name="maxTiers" [disabled]="currentFormMode === 'view'" required>
            </div>

            <div class="feedback-message" 
                *ngIf="feedbackMessage.text" 
                [class.success]="feedbackMessage.type === 'success'" 
                [class.error]="feedbackMessage.type === 'error'"
            >
                <p>{{ feedbackMessage.text }}</p>
            </div>

            <div class="form-actions" [class.hidden]="currentFormMode === 'view'">

                <button 
                    type="submit" 
                    *ngIf="currentFormMode !== 'view'"
                    [disabled]="(currentFormMode === 'update' && !selectedVesselType) || isSubmitting"
                >
                    {{ (currentFormMode === 'create' ? 'BUTTON.CREATE' : 'BUTTON.UPDATE') | translate }}
                </button>

            

                </div>
            
            </form>
    </div>
</div>
