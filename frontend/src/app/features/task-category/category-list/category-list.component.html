<div class="container mt-4">
  <h2>{{ 'CATEGORY_LIST.TITLE' | translate }}</h2>

  <ul class="list-group mt-3 shadow-sm">
    <li *ngFor="let cat of categories" class="list-group-item d-flex justify-content-between align-items-center">
      <div>
        <strong>{{ cat.name }}</strong>
        <p class="mb-0 text-muted small">
          {{ 'CATEGORY_LIST.ID' | translate }}: {{ cat.id }}
        </p>
      </div>
    </li>
  </ul>
</div>
