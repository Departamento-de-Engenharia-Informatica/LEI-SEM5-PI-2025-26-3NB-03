<div class="container">
  <h2>{{ 'CATEGORIES.CREATE_TITLE' | translate }} (US 14)</h2>

  <div *ngIf="message" [class.success]="!isError" [class.error]="isError" class="alert">
    {{ message }}
  </div>

  <form (ngSubmit)="onSubmit()" #catForm="ngForm">
    <div class="form-group">
      <label>{{ 'CATEGORIES.NAME' | translate }}:</label>
      <input type="text" [(ngModel)]="category.name" name="name" required class="form-control">
    </div>

    <div class="form-group">
      <label>{{ 'CATEGORIES.DESCRIPTION' | translate }}:</label>
      <input type="text" [(ngModel)]="category.description" name="description" required class="form-control">
    </div>

    <button type="submit" [disabled]="!catForm.form.valid">
      {{ 'CATEGORIES.CREATE_BUTTON' | translate }}
    </button>
  </form>
</div>
